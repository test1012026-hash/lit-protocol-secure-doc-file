<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password &middot; SecureDocShare</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(120% 80% at 10% 0%, rgba(43, 179, 160, 0.22), transparent 55%),
        radial-gradient(100% 70% at 100% 100%, rgba(56, 120, 160, 0.2), transparent 50%),
        linear-gradient(160deg, #0f1c24, #17303b 55%, #1f3d4a);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      color: #1c2330;
    }
    .card {
      background: #fff;
      width: 100%;
      max-width: 380px;
      margin: 16px;
      padding: 28px 26px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(30, 50, 90, 0.12);
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { margin: 0 0 20px; font-size: 13px; color: #667085; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    input:focus {
      outline: none;
      border-color: #2bb3a0;
      box-shadow: 0 0 0 3px rgba(43, 179, 160, 0.18);
    }
    button {
      width: 100%;
      padding: 11px;
      font-weight: 600;
      color: #04241f;
      background: linear-gradient(180deg, #3cc9b5, #2bb3a0);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(43, 179, 160, 0.28);
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { margin-top: 16px; font-size: 13px; line-height: 1.45; }
    .error { color: #d92d20; }
    .success { color: #027a48; }
    .hint { font-size: 12px; color: #98a2b3; margin: -8px 0 16px; }
    .expiry {
      margin: 0 0 16px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #f0faf8;
      border: 1px solid #b7e8df;
      color: #0f6b5c;
      font-size: 12px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p class="sub" id="subtitle">Checking your reset link...</p>

    <div id="expiry-box" class="expiry hidden"></div>

    <form id="reset-form" class="hidden">
      <label for="password">New Password</label>
      <input type="password" id="password" autocomplete="new-password" placeholder="At least 8 characters" required />

      <label for="confirm">Confirm Password</label>
      <input type="password" id="confirm" autocomplete="new-password" placeholder="Re-enter new password" required />

      <p class="hint">This link expires 30 minutes after it was sent.</p>
      <button type="submit" id="submit">Update Password</button>
    </form>

    <div class="msg" id="message"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const email = params.get('email');

    const form = document.getElementById('reset-form');
    const submitBtn = document.getElementById('submit');
    const message = document.getElementById('message');
    const subtitle = document.getElementById('subtitle');
    const expiryBox = document.getElementById('expiry-box');

    function show(text, type) {
      message.textContent = text;
      message.className = 'msg ' + (type || '');
    }

    function formatCountdown(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      if (m <= 0) return s + ' second' + (s === 1 ? '' : 's');
      return m + ' minute' + (m === 1 ? '' : 's') +
        (s ? ' ' + s + 's' : '');
    }

    async function verifyLink() {
      if (!token || !email) {
        form.classList.add('hidden');
        subtitle.textContent = 'Reset link problem';
        show('This reset link is invalid or incomplete. Please request a new one from the extension.', 'error');
        return;
      }

      try {
        const res = await fetch(
          '/api/auth/password-reset/verify?email=' +
            encodeURIComponent(email) +
            '&token=' +
            encodeURIComponent(token)
        );
        const data = await res.json();

        if (!res.ok || !data.valid) {
          form.classList.add('hidden');
          subtitle.textContent = data.expired ? 'Link expired' : 'Invalid link';
          show(
            data.error ||
              (data.expired
                ? 'This reset link has expired (links are valid for 30 minutes). Please request a new one.'
                : 'This reset link is invalid. Please request a new one.'),
            'error'
          );
          return;
        }

        subtitle.textContent = 'Set a new password for ' + email + '.';
        form.classList.remove('hidden');
        expiryBox.classList.remove('hidden');
        expiryBox.textContent =
          'Link is valid for about ' +
          formatCountdown(data.expiresInSeconds) +
          ' more.';
      } catch (err) {
        form.classList.add('hidden');
        subtitle.textContent = 'Could not verify link';
        show(err.message || 'Could not verify this reset link.', 'error');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      show('', '');

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password.length < 8) {
        show('Password must be at least 8 characters.', 'error');
        return;
      }
      if (password !== confirm) {
        show('Passwords do not match.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';

      try {
        const res = await fetch('/api/auth/password-reset/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, token, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong.');

        form.classList.add('hidden');
        expiryBox.classList.add('hidden');
        subtitle.textContent = 'Password updated';
        show('Password updated successfully. You can now close this page and log in with your new password.', 'success');
      } catch (err) {
        show(err.message, 'error');
        if (/expired/i.test(err.message)) {
          form.classList.add('hidden');
          expiryBox.classList.add('hidden');
          subtitle.textContent = 'Link expired';
        }
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
      }
    });

    verifyLink();
  </script>
</body>
</html>
