<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password &middot; SecureDocShare</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f3fa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      color: #1c2330;
    }
    .card {
      background: #fff;
      width: 100%;
      max-width: 380px;
      margin: 16px;
      padding: 28px 26px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(30, 50, 90, 0.12);
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { margin: 0 0 20px; font-size: 13px; color: #667085; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    input:focus { outline: none; border-color: #3366cc; box-shadow: 0 0 0 3px rgba(51,102,204,0.15); }
    button {
      width: 100%;
      padding: 11px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #3366cc;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { margin-top: 16px; font-size: 13px; }
    .error { color: #d92d20; }
    .success { color: #027a48; }
    .hint { font-size: 12px; color: #98a2b3; margin-top: -8px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p class="sub" id="subtitle">Enter a new password for your account.</p>

    <form id="reset-form">
      <label for="password">New Password</label>
      <input type="password" id="password" autocomplete="new-password" placeholder="At least 8 characters" required />

      <label for="confirm">Confirm Password</label>
      <input type="password" id="confirm" autocomplete="new-password" placeholder="Re-enter new password" required />

      <button type="submit" id="submit">Update Password</button>
    </form>

    <div class="msg" id="message"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const email = params.get('email');

    const form = document.getElementById('reset-form');
    const submitBtn = document.getElementById('submit');
    const message = document.getElementById('message');
    const subtitle = document.getElementById('subtitle');

    function show(text, type) {
      message.textContent = text;
      message.className = 'msg ' + (type || '');
    }

    if (email) {
      subtitle.textContent = 'Set a new password for ' + email + '.';
    }

    if (!token || !email) {
      form.style.display = 'none';
      show('This reset link is invalid or incomplete. Please request a new one.', 'error');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      show('', '');

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password.length < 8) {
        show('Password must be at least 8 characters.', 'error');
        return;
      }
      if (password !== confirm) {
        show('Passwords do not match.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';

      try {
        const res = await fetch('/api/auth/password-reset/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, token, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong.');

        form.style.display = 'none';
        show('Password updated successfully. You can now close this page and log in with your new password.', 'success');
      } catch (err) {
        show(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
